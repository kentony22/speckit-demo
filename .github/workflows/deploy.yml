name: Azure deployment
run-name: Azure ${{ inputs.mode }}

on:
    workflow_dispatch:
        inputs:
            mode:
                description: Preview, deploy, or verify the Azure deployment
                required: true
                type: choice
                options: [preview, deploy, verify]
                default: preview
            preview_run:
                description: Successful preview run ID for this main commit (required for deploy)
                type: string
            free_tier_confirmed:
                description: I reran the Free Tier check with my Azure user account (required for deploy)
                type: boolean
                default: false

concurrency:
    group: azure-deployment
    cancel-in-progress: false

permissions: {}

jobs:
    build:
        name: Build and test JAR
        if: github.ref == 'refs/heads/main' && inputs.mode == 'deploy'
        permissions:
            contents: read
            actions: read
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Require Free Tier confirmation and a successful preview
              env:
                  GH_TOKEN: ${{ github.token }}
                  PREVIEW_RUN: ${{ inputs.preview_run }}
                  FREE_TIER_CONFIRMED: ${{ inputs.free_tier_confirmed }}
              run: |
                  if [[ "$FREE_TIER_CONFIRMED" != true ]]; then
                      echo "::error::Rerun the subscription-wide Free Tier check before deploying."
                      exit 1
                  fi
                  if [[ ! "$PREVIEW_RUN" =~ ^[0-9]+$ ]]; then
                      echo "::error::Provide the run ID of a successful preview of this commit."
                      exit 1
                  fi
                  gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIEW_RUN" |
                      jq -e --arg sha "$GITHUB_SHA" '
                        .path == ".github/workflows/deploy.yml" and .head_branch == "main" and
                        .head_sha == $sha and .event == "workflow_dispatch" and
                        .display_title == "Azure preview" and .conclusion == "success"
                      ' > /dev/null

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: frontend/.node-version
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
              with:
                  distribution: temurin
                  java-version: '25'
                  cache: maven

            - name: Build React
              working-directory: frontend
              run: |
                  npm ci
                  npm run build

            - name: Test and package the executable JAR
              run: |
                  docker compose up -d cosmos
                  truststore="$(./scripts/prepare-local-cosmos.sh)"
                  cd backend
                  JAVA_TOOL_OPTIONS="-Djavax.net.ssl.trustStore=\"$truststore\" -Djavax.net.ssl.trustStorePassword=changeit" \
                      ./mvnw -B -ntp -Pbundled-web verify
                  jar tf target/todo-0.1.0-SNAPSHOT.jar > "$RUNNER_TEMP/jar-entries"
                  grep -Fx 'BOOT-INF/classes/static/index.html' "$RUNNER_TEMP/jar-entries"
                  grep -E '^BOOT-INF/classes/static/assets/.+\.js$' "$RUNNER_TEMP/jar-entries"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: tested-jar
                  path: backend/target/todo-0.1.0-SNAPSHOT.jar
                  if-no-files-found: error
                  overwrite: true
                  retention-days: 1

    azure:
        name: Azure ${{ inputs.mode }}
        needs: build
        # Keep the job eligible for cleanup when the run is cancelled.
        if: |
            always() && github.ref == 'refs/heads/main' &&
            ((inputs.mode != 'deploy' && needs.build.result == 'skipped') ||
             (inputs.mode == 'deploy' && needs.build.result == 'success'))
        permissions:
            contents: read
            id-token: write
        environment: ${{ vars.AZURE_ENVIRONMENT }}
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        env:
            AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            AZURE_CORE_OUTPUT: none
            AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}
            AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
            AZURE_APP_SERVICE_PLAN: ${{ secrets.AZURE_APP_SERVICE_PLAN }}
            AZURE_WEB_APP: ${{ secrets.AZURE_WEB_APP }}
            AZURE_COSMOS_ACCOUNT: ${{ secrets.AZURE_COSMOS_ACCOUNT }}
            AZURE_VERIFIER_IPV4: ${{ secrets.AZURE_VERIFIER_IPV4 }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              if: success() && !cancelled()
              with:
                  persist-credentials: false

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              if: success() && !cancelled() && inputs.mode == 'deploy'
              with:
                  name: tested-jar
                  path: ${{ runner.temp }}/tested-jar

            - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
              if: success() && !cancelled()
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Install Bicep
              if: success() && !cancelled() && inputs.mode != 'verify'
              run: az bicep install --version v0.49.2

            - name: Validate free-tier settings and preview changes
              if: success() && !cancelled() && inputs.mode != 'verify'
              env:
                  DEPLOY_MODE: ${{ inputs.mode }}
              run: ./scripts/azure-preflight.sh "$DEPLOY_MODE"

            - name: Deploy the tested JAR using OIDC
              if: success() && !cancelled() && inputs.mode == 'deploy'
              id: deploy_jar
              run: ./scripts/azure-deploy-jar.sh "$RUNNER_TEMP/tested-jar/todo-0.1.0-SNAPSHOT.jar"

            - name: Revoke temporary SCM access and verify it is closed
              if: always() && (steps.deploy_jar.outcome == 'success' || steps.deploy_jar.outcome == 'failure' || steps.deploy_jar.outcome == 'cancelled')
              timeout-minutes: 2
              run: ./scripts/azure-deploy-jar.sh --cleanup

            - name: Report deployed settings and browser URL
              if: success() && !cancelled() && inputs.mode != 'preview'
              run: |
                  az appservice plan show --subscription "$AZURE_SUBSCRIPTION_ID" -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_APP_SERVICE_PLAN" -o json |
                      jq -e '.sku.name == "F1" and .sku.capacity == 1 and ((.properties.reserved // .reserved) == true)'
                  az webapp config show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEB_APP" -o json |
                      jq -e --arg ip "$AZURE_VERIFIER_IPV4/32" '
                          .linuxFxVersion == "JAVA|25-java25" and
                          .ipSecurityRestrictionsDefaultAction == "Deny" and
                          ([.ipSecurityRestrictions[] | select(.action == "Allow") | .ipAddress] == [$ip]) and
                          .scmIpSecurityRestrictionsDefaultAction == "Deny" and
                          all(.scmIpSecurityRestrictions[]?; .action != "Allow")
                      '
                  az cosmosdb show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_COSMOS_ACCOUNT" -o json |
                      jq -e '.enableFreeTier and .disableLocalAuth and
                          .capacity.totalThroughputLimit == 1000 and (.locations | length) == 1'
                  az cosmosdb sql container throughput show -g "$AZURE_RESOURCE_GROUP" \
                      -a "$AZURE_COSMOS_ACCOUNT" -d task-notebook -n tasks -o json |
                      jq -e '.resource.throughput == 400 and (.resource.autoscaleSettings == null)'
                  host="$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_WEB_APP" --query defaultHostName -o tsv)"
                  for path in / /api/tasks; do
                      status="$(curl -fsS --max-time 30 --output /dev/null --write-out '%{http_code}' "https://$host$path" || true)"
                      if [[ "$status" != 403 ]]; then
                          echo "Expected HTTP 403 outside the verifier network for $path, got $status." >&2
                          exit 1
                      fi
                  done
                  printf 'Browser verification from the allowed IP: https://%s/\n' "$host" >> "$GITHUB_STEP_SUMMARY"
