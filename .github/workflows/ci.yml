name: CI

on:
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    frontend:
        name: Frontend build
        runs-on: ubuntu-24.04
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: frontend/.node-version
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci
            - run: npm test
            - run: npm run build

    backend:
        name: Backend tests
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
              with:
                  distribution: temurin
                  java-version: '25'
                  cache: maven
            - name: Start Cosmos DB vNext emulator
              run: docker compose up -d cosmos
            - name: Prepare Java trust store and run tests
              shell: bash
              run: |
                  truststore="$(./scripts/prepare-local-cosmos.sh)"
                  cd backend
                  JAVA_TOOL_OPTIONS="-Djavax.net.ssl.trustStore=\"$truststore\" -Djavax.net.ssl.trustStorePassword=changeit" \
                      ./mvnw -B -ntp verify
            - name: Show emulator logs on failure
              if: failure()
              run: docker compose logs --no-color cosmos

    infrastructure:
        name: Bicep validation
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Build and lint Bicep
              run: |
                  az bicep install --version v0.49.2
                  az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/main.json"
                  az bicep lint --file infra/main.bicep
                  bash -n scripts/azure-check-free-tier.sh
                  bash -n scripts/azure-preflight.sh
                  bash -n scripts/azure-deploy-jar.sh
